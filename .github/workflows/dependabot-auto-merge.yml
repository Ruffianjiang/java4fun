# 放到 <repo>/.github/workflows/dependabot-auto-merge.yml
# 对 dependabot[bot] 的 patch/minor 更新自动 squash 合并；major 不自动合并（人工 review）
name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge (skip major, fallback if auto-merge disabled)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "auto-merge unavailable on this repo, merging directly"
            gh pr merge --squash "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
